[package]
name = "rustpg2d-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustpg2d-engine.workspace = true
macroquad.workspace = true
egui-macroquad.workspace = true
egui-phosphor = "0.9"
anyhow.workspace = true
ron.workspace = true
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# File › Import…: Tiled maps (.tmx XML, .tmj / Aseprite JSON through rhai), compressed tile data.
quick-xml = "0.41"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rhai.workspace = true
# AppImage / Flatpak exports (package.rs).
rustpg2d-packaging.workspace = true
