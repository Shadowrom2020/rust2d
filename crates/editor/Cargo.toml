[package]
name = "rust2d-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rust2d-engine.workspace = true
macroquad.workspace = true
egui-macroquad.workspace = true
egui-phosphor = "0.9"
anyhow.workspace = true
ron.workspace = true
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Writes the squashfs image of AppImage exports (export.rs / package.rs).
backhand = { version = "0.25", default-features = false, features = ["gzip"] }
