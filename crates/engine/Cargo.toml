[package]
name = "rust2d-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
macroquad.workspace = true
serde.workspace = true
ron.workspace = true
postcard.workspace = true
lz4_flex.workspace = true
rhai.workspace = true
anyhow.workspace = true
png = "0.17"
# Portable math functions (glibc_compat.rs).
libm = "0.2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
# The example generator encodes its music as Ogg Vorbis.
vorbis_rs = { version = "0.5", default-features = false }
