# A merge into master is a release (AGENTS.md): build the AppImage and Flatpak of the rust2d
# toolkit, tag the merge commit vX.Y.Z (the version in Cargo.toml, checked by CI before the
# merge), publish a GitHub Release with the CHANGELOG section and the packages, and open the
# pull request that merges master back into develop.
# Run by hand (Actions > Release > Run workflow) with dry_run to only build the packages.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only build the packages (no tag, no release, no pull request)
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version
        id: v
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then
            echo "v$v is already released: nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          case "$v" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - uses: dtolnay/rust-toolchain@stable
        if: steps.v.outputs.exists == 'false' || inputs.dry_run
      - uses: Swatinem/rust-cache@v2
        if: steps.v.outputs.exists == 'false' || inputs.dry_run
        with:
          shared-key: release
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev
        if: steps.v.outputs.exists == 'false' || inputs.dry_run
      - uses: ./.github/actions/packages
        if: steps.v.outputs.exists == 'false' || inputs.dry_run
      - name: Packages of the dry run
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: rust2d-packages
          path: dist/
          retention-days: 7
      - name: Tag and GitHub Release
        if: steps.v.outputs.exists == 'false' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
          PRE: ${{ steps.v.outputs.prerelease }}
        run: |
          cargo xtask release-notes "$V" > "$RUNNER_TEMP/notes.md"
          git tag "v$V" "$GITHUB_SHA"
          git push origin "v$V"
          flags=()
          if [ "$PRE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "v$V" dist/*.AppImage dist/*.flatpak dist/SHA256SUMS \
            --title "rust2d $V" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag "${flags[@]}"
      - name: Back-merge pull request (master into develop)
        if: steps.v.outputs.exists == 'false' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          git fetch -q origin develop
          if [ "$(git rev-list --count origin/develop..HEAD)" -eq 0 ]; then
            echo "develop already contains this release"
          elif [ -n "$(gh pr list --base develop --head master --state open --json number --jq '.[].number')" ]; then
            echo "a back-merge pull request is already open"
          else
            gh pr create --base develop --head master --title "Merge v$V back into develop" \
              --body "Brings the version bump and the release / hotfix changes of v$V back into develop (AGENTS.md: finishing a release). Merge with a merge commit."
          fi
