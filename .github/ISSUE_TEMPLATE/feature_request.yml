name: Feature request
description: An idea for the engine, the editor or the asset library.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why / what would it make possible?
  - type: textarea
    id: example
    attributes:
      label: An example (map, script, screenshot)
